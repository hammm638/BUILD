name: Build APK

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Website URL"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleRelease
